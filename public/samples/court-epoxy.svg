<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="A finished epoxy flake garage floor">
  <defs>
    <linearGradient id="walle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f5"/><stop offset="1" stop-color="#d7dee4"/></linearGradient>
    <linearGradient id="floore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6b0"/><stop offset="1" stop-color="#c2cbd3"/></linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#walle)"/>
  <rect x="0" y="120" width="1600" height="520" fill="#e3e9ee"/>
  <rect x="120" y="180" width="520" height="360" fill="#cfd7de" stroke="#b4bec7" stroke-width="6"/>
  <g stroke="#b4bec7" stroke-width="4"><line x1="120" y1="270" x2="640" y2="270"/><line x1="120" y1="360" x2="640" y2="360"/><line x1="120" y1="450" x2="640" y2="450"/></g>
  <rect x="980" y="240" width="220" height="300" fill="#b9c2ca"/>
  <!-- floor in perspective -->
  <polygon points="0,640 1600,640 1600,1200 0,1200" fill="url(#floore)"/>
  <polygon points="380,640 1220,640 1600,1200 -160,1200" fill="#b7c0c8"/>
  <!-- flake speckles -->
  <g>
    <circle cx="500" cy="780" r="6" fill="#4f6678"/><circle cx="700" cy="820" r="5" fill="#7a8b9a"/>
    <circle cx="900" cy="760" r="6" fill="#3f5666"/><circle cx="1080" cy="860" r="6" fill="#8fa0ad"/>
    <circle cx="620" cy="980" r="7" fill="#4f6678"/><circle cx="980" cy="1020" r="6" fill="#6b7d8c"/>
    <circle cx="430" cy="1080" r="7" fill="#3f5666"/><circle cx="1180" cy="980" r="6" fill="#7a8b9a"/>
    <circle cx="800" cy="1120" r="7" fill="#4f6678"/><circle cx="760" cy="900" r="5" fill="#90a1ae"/>
  </g>
  <!-- gloss highlight -->
  <polygon points="200,700 600,700 760,1100 -40,1100" fill="#ffffff" opacity="0.10"/>
  <text x="800" y="1150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" fill="#3a4854" opacity="0.8">Decorative flake epoxy floor by GRIT</text>
</svg>
