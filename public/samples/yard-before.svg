<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="An empty backyard before a court is built">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0f5"/>
      <stop offset="1" stop-color="#e7f3fb"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79b35a"/>
      <stop offset="1" stop-color="#5c9442"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#sky)"/>
  <!-- distant house -->
  <rect x="120" y="300" width="520" height="230" fill="#cfd8e0"/>
  <polygon points="100,300 380,180 660,300" fill="#aab6c2"/>
  <rect x="250" y="380" width="80" height="150" fill="#8b6a4f"/>
  <rect x="430" y="360" width="90" height="90" fill="#9fc3dd"/>
  <!-- neighbor house -->
  <rect x="980" y="330" width="460" height="200" fill="#d6dde4"/>
  <polygon points="960,330 1210,220 1460,330" fill="#b6c1cc"/>
  <!-- fence line -->
  <rect x="0" y="500" width="1600" height="40" fill="#caa877"/>
  <g fill="#b9965f">
    <rect x="40" y="500" width="14" height="60"/><rect x="240" y="500" width="14" height="60"/>
    <rect x="440" y="500" width="14" height="60"/><rect x="640" y="500" width="14" height="60"/>
    <rect x="840" y="500" width="14" height="60"/><rect x="1040" y="500" width="14" height="60"/>
    <rect x="1240" y="500" width="14" height="60"/><rect x="1440" y="500" width="14" height="60"/>
  </g>
  <!-- tree -->
  <rect x="1330" y="360" width="36" height="180" fill="#7a5a3a"/>
  <circle cx="1348" cy="330" r="120" fill="#4f8a3f"/>
  <circle cx="1268" cy="370" r="80" fill="#5c9a48"/>
  <circle cx="1430" cy="370" r="80" fill="#5c9a48"/>
  <!-- grass yard -->
  <rect x="0" y="540" width="1600" height="660" fill="url(#grass)"/>
  <ellipse cx="800" cy="560" rx="900" ry="40" fill="#6ba84e" opacity="0.5"/>
  <text x="800" y="1140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" fill="#3c5a2c" opacity="0.55">Your backyard today</text>
</svg>
