<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="A finished backyard basketball court">
  <defs>
    <linearGradient id="skyb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0f5"/><stop offset="1" stop-color="#e7f3fb"/></linearGradient>
    <linearGradient id="grassb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79b35a"/><stop offset="1" stop-color="#5c9442"/></linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#skyb)"/>
  <rect x="120" y="300" width="520" height="230" fill="#cfd8e0"/><polygon points="100,300 380,180 660,300" fill="#aab6c2"/>
  <rect x="250" y="380" width="80" height="150" fill="#8b6a4f"/><rect x="430" y="360" width="90" height="90" fill="#9fc3dd"/>
  <rect x="980" y="330" width="460" height="200" fill="#d6dde4"/><polygon points="960,330 1210,220 1460,330" fill="#b6c1cc"/>
  <rect x="0" y="500" width="1600" height="40" fill="#caa877"/>
  <g fill="#b9965f"><rect x="40" y="500" width="14" height="60"/><rect x="240" y="500" width="14" height="60"/><rect x="440" y="500" width="14" height="60"/><rect x="640" y="500" width="14" height="60"/><rect x="840" y="500" width="14" height="60"/><rect x="1040" y="500" width="14" height="60"/><rect x="1240" y="500" width="14" height="60"/><rect x="1440" y="500" width="14" height="60"/></g>
  <rect x="1330" y="360" width="36" height="180" fill="#7a5a3a"/><circle cx="1348" cy="330" r="120" fill="#4f8a3f"/><circle cx="1268" cy="370" r="80" fill="#5c9a48"/><circle cx="1430" cy="370" r="80" fill="#5c9a48"/>
  <rect x="0" y="540" width="1600" height="660" fill="url(#grassb)"/>
  <!-- gray apron -->
  <polygon points="470,600 1130,600 1380,1110 220,1110" fill="#5b6b78"/>
  <!-- blue court -->
  <polygon points="540,628 1060,628 1280,1075 320,1075" fill="#2b6fa0"/>
  <g stroke="#ffffff" stroke-width="6" fill="none">
    <polygon points="540,628 1060,628 1280,1075 320,1075"/>
    <!-- key -->
    <polygon points="710,628 890,628 930,820 670,820"/>
    <ellipse cx="800" cy="820" rx="130" ry="44"/>
    <!-- three-point arc (near) -->
    <path d="M360,1030 Q800,840 1240,1030"/>
  </g>
  <!-- hoop -->
  <rect x="788" y="470" width="24" height="170" fill="#2a2f36"/>
  <rect x="720" y="430" width="160" height="90" rx="6" fill="#eef2f5" stroke="#2a2f36" stroke-width="5"/>
  <rect x="772" y="486" width="56" height="34" fill="none" stroke="#2a2f36" stroke-width="4"/>
  <ellipse cx="800" cy="540" rx="44" ry="14" fill="none" stroke="#e8772e" stroke-width="6"/>
  <text x="800" y="1150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" fill="#ffffff" opacity="0.9">Custom basketball court by GRIT</text>
</svg>
